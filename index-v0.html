    async function renderDragonEndingPage(index,{direction='forward',endingOverride=null}={}){const token=++endingRenderToken;clearAutoAdvance();stopAnswerListening();stopSound();const ending=endingOverride||currentEnding(),pages=dragonEndingPages(ending),page=pages[index];if(!page){endingInProgress=false;return}state.screen='ending-transition';await gentleTransition(page.image||ending.image,{direction});if(token!==endingRenderToken)return;state.endingPageIndex=index;const last=index===pages.length-1,beatKey=`ending_${state.forkKey||'base'}_${page.key||`page_${index+1}`}`;if(!state.storyBeats.some(beat=>beat.beatKey===beatKey))state.storyBeats.push({beatKey,image:page.image||ending.image,text:page.text,audio:page.audio||null,ending:true});saveCurrentAdventure();state.screen='ending';endingInProgress=false;const action=last?`${endingActions()}<button class="secondary dragon-ending-page-back" id="ending-page-back" type="button">← See the surprise again</button>`:`<button class="primary dragon-ending-page-next" id="ending-page-next" type="button">${escapeHTML(page.buttonLabel||'Turn the page')} →</button>`;app.innerHTML=`<section class="screen story-screen dragon-ending-screen" data-ending-page="${index+1}"><img class="scene-image" src="${imgPath(page.image||ending.image)}" alt="${escapeHTML(page.alt||`The ending scene for ${story().title}`)}"><div class="shade"></div>${topbar()}${storyTrail()}${last?celebration():''}${storySpread(page,{statusId:'ending-listening',statusText:`Ending page ${index+1} of ${pages.length}. Listen, or turn the page anytime.`,actionHTML:action,actionId:'dragon-ending-actions',ariaLabel:`Dragon ending page ${index+1}`})}</section>`;if(last){bindEndingActions();document.getElementById('ending-page-back').onclick=()=>navigateDragonEndingPage(index-1,'back')}else document.getElementById('ending-page-next').onclick=()=>navigateDragonEndingPage(index+1);await speak(page);if(token!==endingRenderToken||state.screen!=='ending'||state.endingPageIndex!=     async function enterEnding(timeSafe=false){if(endingInProgress||['ending','ending-transition','mission-picker','mission','recap','replay'].includes(state.screen))return;endingInProgress=true;clearAutoAdvance();stopAnswerListening();stopRecordingTracks();clearSessionTimer();state.endedByTimer=state.endedByTimer||Boolean(timeSafe);state.timeWrapRequested=false;state.expiresAt=null;state.endedAt=state.endedAt||Date.now();let ending=currentEnding();if(timeSafe&&state.storyKey!=='dragon'){const bridge=storyExperience().quick?.resolutionByNode?.[state.node?.replace(/^quick_/, '')]||Object.values(storyExperience().quick?.resolutionByNode||{})[0];if(bridge)ending={...ending,text:`Time is nearly up, so here is how this adventure lands. ${bridge.text} ${ending.text}`,audio:null,speechSegments:null,pages:null}}if(dragonEndingPages(ending).length){await renderDragonEndingPage(0,{endingOverride:ending});return}if(pagesForEntity(ending).length>1){await renderPagedEndingPage(0,{endingOverride:ending});return}await gentleTransition(ending.image);if(!state.storyBeats.some(beat=>beat.ending))state.storyBeats.push({beatKey:`ending_${state.forkKey||'base'}`,image:ending.image,text:ending.text,audio:ending.audio||null,ending:true});saveCurrentAdventure();state.screen='ending';endingInProgress=false;app.innerHTML=`<section class="screen story-screen"><img class="scene-image" src="${imgPath(ending.image)}" alt="The ending scene for ${escapeHTML(story().title)}"><div class="shade"></div>${topbar()}${storyTrail()}${celebration()}${storySpread(ending,{statusId:'ending-listening',statusText:'The story voice is telling your ending. You can continue anytime.',actionHTML:endingActions(),ariaLabel:`Ending scene for ${story().title}`})}</section>`;bindEndingActions();await speak({audio:ending.audio,text:ending.text});if(state.screen!=='ending')return;if(DEMO_MODE&&AUTO_PLAY_REWARD_VIDEO&&ending.video&&!timeSafe)tryRewardVideo();else revealEndingActions()}
    function tryRewardVideo(){const ending=currentEnding(),video=document.createElement('video');let settled=false,timeout=null;const stopPreload=()=>{clearTimeout(timeout);video.onloadeddata=video.onerror=null};const useFallback=()=>{if(settled)return;settled=true;stopPreload();video.removeAttribute('src');video.load();showEndingButton()};timeout=setTimeout(useFallback,6500);video.preload='auto';video.onloadeddata=()=>{if(settled)return;settled=true;stopPreload();if(state.screen!=='ending')return;app.innerHTML=`<section class="screen reward-video"><video class="scene-image" src="assets/video/${escapeHTML(ending.video)}" poster="${imgPath(ending.image)}" preload="auto" autoplay playsinline></video><div class="shade"></div>${topbar()}<div class="stage"><div class="transcript">${escapeHTML(ending.videoText)}</div></div></section>`;const shown=app.querySelector('video');let playbackDone=false,playbackTimer=setTimeout(finishPlayback,45000);function finishPlayback(){if(playbackDone)return;playbackDone=true;clearTimeout(playbackTimer);showEndingButton()}shown.onloadedmetadata=()=>{if(Number.isFinite(shown.duration)&&shown.duration>0){clearTimeout(playbackTimer);playbackTimer=setTimeout(finishPlayback,Math.min(60000,(shown.duration+3)*1000))}};shown.onended=shown.onerror=finishPlayback;const play=shown.play();if(play&&play.catch)play.catch(finishPlayback)};video.onerror=useFallback;video.src=`assets/video/${ending.video}`}
    function showEndingButton(){if(state.screen!=='ending')return;const ending=currentEnding();app.innerHTML=`<section class="screen story-screen"><img class="scene-image" src="${imgPath(ending.image)}" alt="The ending story scene"><div class="shade"></div>${topbar()}${celebration()}${storySpread(ending,{statusId:'ending-listening',statusText:'Your ending is ready.',statusReady:true,actionHTML:endingActions(),ariaLabel:`Ending scene for ${story().title}`})}</section>`;bindEndingActions();revealEndingActions()}

    function renderMissionPicker(){clearAutoAdvance();stopSound();stopAnswerListening();clearSessionTimer();state.expiresAt=null;state.screen='mission-picker';const experience=storyExperience(),prompt=missionPromptEntity(),dragonReady=state.storyKey==='dragon',visiblePrompt=dragonReady?prompt.text:'Pick one off-screen mission.',disabled=dragonReady?'':' disabled';quizShell(`<div class="mission-card"><div class="mascot">🌟</div><div class="question-count">Put the screen down and play</div><div class="speech-caption">${escapeHTML(visiblePrompt)}</div><div class="answer-status" id="mission-status">${dragonReady?'Choose a picture anytime—or listen, then say a mission.':'Listen to all three…'}</div><div class="mission-options" id="mission-options">${experience.missions.map((mission,index)=>`<button class="mission-option ${DEMO_MODE&&index===0?'demo-choice':''}" data-mission="${index}"${disabled}>${DEMO_MODE&&index===0?'<span class="demo-pick">Demo pick</span>':''}<span class="emoji">${mission.emoji}</span>${escapeHTML(mission.title)}</button>`).join('')}</div><button class="repeat-question" id="repeat-missions"${disabled}><span>↻</span><small>Hear again</small></button></div>`,"The timer is finished. No camera or microphone is needed.");document.querySelectorAll('[data-mission]').forEach(button=>button.onclick=()=>selectMission(Number(button.dataset.mission)));document.getElementById('repeat-missions').onclick=repeatMissions;speak(prompt).then(()=>{if(state.screen!=='mission-picker')return;document.querySelectorAll('[data-mission],#repeat-missions').forEach(button=>button.disabled=false);document.getElementById('mission-status').textContent='I’m listening. Say a mission.';startMissionListening()})}
    function repeatMissions(){if(state.screen!=='mission-picker')return;stopAnswerListening();renderMissionPicker()}
    function startMissionListening(attempt=0){if(state.screen!=='mission-picker')return;const Recognition=answerRecognitionClass(),experience=storyExperience(),status=document.getElementById('mission-status');if(!Recognition){status.textContent='Choose a picture.';return}stopAnswerListening();const recognition=new Recognition();answerRecognition=recognition;let finished=false;recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=5;const retry=message=>{if(finished)return;finished=true;stopAnswerListening();if(state.screen!=='mission-picker')return;status.textContent=message;voiceRetryTimer=setTimeout(()=>attempt<1?startMissionListening(attempt+1):repeatMissions(),900)};recognition.onresult=event=>{const alternatives=Array.from(event.results[0]||[]).map(result=>result.transcript).filter(Boolean);if(alternatives.some(answer=>/\b(repeat|again)\b/i.test(answer))){finished=true;stopAnswerListening();repeatMissions();return}const matches=alternatives.map(answer=>matchStoryChoice(experience.missions.map(mission=>({label:mission.title,accept:[mission.key]})),answer)).filter(index=>index>=0);if(matches.length){finished=true;stopAnswerListening();selectMission(matches[0])}else retry('I missed that mission. I’m listening again…')};recognition.onerror=event=>event.error==='not-allowed'?(finished=true,stopAnswerListening(),status.textContent='Choose a picture.'):retry('I missed that. I’m listening again…');recognition.onend=()=>retry('Take your time. I’m listening again…');try{recognition.start();answerRecognitionTimer=setTimeout(()=>retry('Take your time. I’ll say the missions again…'),listeningWindow())}catch(_){status.textContent='Choose a picture.'}}
    async function narrateMissionInstruction(mission){if(state.screen!=='mission')return;document.querySelectorAll('#mission-done,#repeat-mission,#mission-skip').forEach(button=>button.disabled=true);await speak({audio:mission.audio,text:mission.instruction});if(state.screen==='mission')document.querySelectorAll('#mission-done,#repeat-mission,#mission-skip').forEach(button=>button.disabled=false)}
    async function selectMission(index){if(state.screen!=='mission-picker')return;clearAutoAdvance();stopSound();stopAnswerListening();const mission=storyExperience().missions[index];if(!mission)return;state.selectedMission={index,emoji:mission.emoji,title:mission.title,instruction:mission.instruction};saveCurrentAdventure();state.screen='mission';await gentleTransition();quizShell(`<div class="mission-card"><div class="mission-active">${mission.emoji}</div><div class="question-count">Off-screen mission</div><div class="speech-caption">${escapeHTML(mission.instruction)}</div><p class="mission-rest">Set Sparks down while you do it. Come back when you are ready.</p><div class="parent-actions"><button class="primary" id="mission-done" disabled>We did it! →</button><button class="secondary" id="repeat-mission" disabled>🔊 Hear it again</button><button class="secondary" id="mission-skip" disabled>Maybe later</button></div></div>`,"Stay together. This activity is not timed and nothing is recorded.");document.getElementById('mission-done').onclick=renderRecap;document.getElementById('mission-skip').onclick=renderRecap;document.getElementById('repeat-mission').onclick=()=>narrateMissionInstruction(mission);await narrateMissionInstruction(mission)}

    function startReplay(snapshot,returnTarget='recap'){if(!snapshot?.beats?.length)return;stopSound();stopAnswerListening();stopRecordingTracks();clearAutoAdvance();clearSessionTimer();state.expiresAt=null;state.replayData=snapshot;state.replayReturn=returnTarget;state.replayIndex=0;state.replayPaused=false;renderReplayBeat(0)}
    async function renderReplayBeat(index,{direction='forward'}={}){const token=++replayRenderToken,snapshot=state.replayData;if(!snapshot?.beats?.[index]){finishReplay();return}stopSound();clearAutoAdvance();state.screen='replay';state.replayIndex=index;const beat=snapshot.beats[index],active=CONTENT.stories[snapshot.storyKey],last=index===snapshot.beats.length-1;await gentleTransition(beat.image,{direction});if(token!==replayRenderToken||state.screen!=='replay')return;app.innerHTML=`<section class="screen replay-screen"><div class="quiz-inner"><div class="replay-card"><div class="replay-progress">Replay · Page ${index+1} of ${snapshot.beats.length}</div><h2>${active.emoji} ${escapeHTML(active.title)}</h2><img src="${imgPath(beat.image)}" alt="Story replay page"><div class="speech-caption">${escapeHTML(beat.text)}</div><div class="listening" id="replay-listening"><span class="sound-dot"></span>The story voice is replaying your exact path…</div><div class="replay-controls"><button class="secondary" id="replay-prev" ${index===0?'disabled':''}>← Previous</button><button class="parent-button" id="replay-pause">Pause</button><button class="secondary" id="replay-next">${last?'Finish replay':'Next →'}</button><button class="secondary" id="replay-exit">Exit</button></div></div></div></section>`;document.getElementById('replay-prev').onclick=()=>renderReplayBeat(index-1,{direction:'back'});document.getElementById('replay-pause').onclick=toggleReplay;document.getElementById('replay-next').onclick=()=>last?finishReplay():renderReplayBeat(index+1);document.getElementById('replay-exit').onclick=finishReplay;await speak(beat);if(token===replayRenderToken&&state.screen==='replay'&&state.replayIndex===index&&!state.replayPaused){document.getElementById('replay-listening')?.classList.add('fade-away');autoAdvanceTimer=setTimeout(()=>{if(token===replayRenderToken&&state.screen==='replay'&&!state.replayPaused)last?finishReplay():renderReplayBeat(index+1)},1400)}}
    function toggleReplay(){if(state.screen!=='replay')return;const button=document.getElementById('replay-pause');if(state.replayPaused){state.replayPaused=false;if(button)button.textContent='Pause';renderReplayBeat(state.replayIndex)}else{state.replayPaused=true;clearAutoAdvance();stopSound();if(button)button.textContent='Play'}}
    function finishReplay(){replayRenderToken++;stopSound();clearAutoAdvance();const target=state.replayReturn;state.replayData=null;state.replayPaused=false;if(target==='shelf')renderShelf();else renderRecap()}

    function exploredFacts(){const seen=[...new Set(state.questionResults.map(result=>result.sourceIndex).filter(Number.isInteger))],facts=seen.map(index=>story().questions[index]?.correctText||'').map(text=>text.replace(/^(Yes!|You caught my mistake!)\s*/,'')).filter(Boolean);return[...new Set(facts)]}
    async function renderRecap(){clearAutoAdvance();stopSound();stopAnswerListening();clearSessionTimer();state.expiresAt=null;await gentleTransition();state.screen='recap';const active=story(),experience=storyExperience(),choiceLabels=state.choiceHistory.length?state.choiceHistory.map(choice=>`${choice.emoji} ${choice.label}`).join(' → '):'This route moved forward without an extra choice.',facts=exploredFacts(),storyList=state.storyBeats.map((beat,index)=>`<li><img src="${imgPath(beat.image)}" alt=""><span><b>Scene ${index+1}</b><br>${escapeHTML(beat.text)}</span></li>`).join(''),elapsed=state.startedAt?Math.max(1,Math.round(((state.endedAt||Date.now())-state.startedAt)/60000)):0,shelfSaved=state.shelfSaveSucceeded,mission=state.selectedMission?`${state.selectedMission.emoji} ${state.selectedMission.title}: ${state.selectedMission.instruction}`:`Try later: ${experience.followUp}`;app.innerHTML=`<section class="screen recap-screen"><div class="recap"><div class="spark">✦</div><h1>${escapeHTML(state.childName)}’s ${escapeHTML(active.title)}</h1><div class="recap-lead">${escapeHTML(experience.strength)}: ${escapeHTML(experience.strengthText)}</div><div class="facts"><div class="fact"><b>The picture-story they made</b><ol class="story-recap-list">${storyList}</ol></div><div class="fact"><b>Facts we explored</b>${facts.length?`<ul class="fact-list">${facts.map(fact=>`<li>${escapeHTML(fact)}</li>`).join('')}</ul>`:'<br>The knowledge questions were not reached before the gentle ending.'}</div><div class="fact"><b>Choices they made</b><br>${escapeHTML(choiceLabels)}</div><div class="fact"><b>Wonder idea</b><br>${escapeHTML(state.wonderChoice?`${state.wonderChoice.emoji} ${state.wonderChoice.label}`:'The Wonder Moment was not reached.')}</div><div class="fact"><b>Session shape</b><br>${state.storyLength==='quick'?'Quick story':'Full adventure'} · ${ageBandLabel()} · about ${elapsed} ${elapsed===1?'minute':'minutes'}${state.endedByTimer?' · gently wrapped for the time limit':''}</div><div class="fact"><b>Take it into the real world</b><br>${escapeHTML(mission)}</div><div class="fact"><b>Story Shelf</b><br>${shelfSaved?'Saved on this device without personal or voice data.':state.saveShelf?'This device could not save the route, so it remains in this session only.':'Not saved. This exact route is available only during this session.'}</div></div><div class="dinner">🍽️ ${escapeHTML(experience.followUp)}</div><div class="parent-actions"><button class="primary" id="replay-current">▶ Replay this adventure</button><button class="secondary" id="another-story">Choose another story</button>${readShelf().length?'<button class="secondary" id="recap-shelf">Open Story Shelf</button>':''}<button class="secondary" id="reset">Change setup ↺</button></div></div></section>`;document.getElementById('replay-current').onclick=()=>startReplay(currentSnapshot(),'recap');document.getElementById('another-story').onclick=renderLibrary;const shelf=document.getElementById('recap-shelf');if(shelf)shelf.onclick=()=>renderShelf();document.getElementById('reset').onclick=reset}
    window.addEventListener('beforeunload',()=>{clearAutoAdvance();stopAnswerListening();stopRecordingTracks()});renderWelcome();
  </script>
